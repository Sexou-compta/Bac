<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>أستاذ الشارع | فضاء التلميذ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#121212;--card:#1e1e1e;--card2:#262626;--pink:#ff007f;--txt:#fff;--muted:#a9a9a9;--ok:#28a745;--bad:#dc3545;--warn:#ffb020;--line:#333}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--txt);min-height:100vh;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
button{border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:15px;padding:12px 14px;color:#fff;background:#333;transition:.15s}
button:active{transform:scale(.97)}
.btn-pink{background:var(--pink);box-shadow:0 0 10px rgba(255,0,127,.35)}
.btn-ok{background:rgba(40,167,69,.18);color:var(--ok);border:1px solid var(--ok)}
.btn-line{background:transparent;border:1px solid #444;color:var(--muted)}
.w100{width:100%}
a{color:var(--pink)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:#000;border-bottom:2px solid var(--pink);display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
.top img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 10px rgba(255,0,127,.4)}
.top .t1{font-weight:900;color:var(--pink);font-size:18px;line-height:1.1}
.top .t2{font-size:12px;color:var(--muted)}
.top .back{background:transparent;font-size:22px;padding:4px 8px;color:#fff}
.top .grow{flex:1;min-width:0}
.top .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#installBtn{display:none;background:var(--pink);font-size:12px;padding:8px 10px}

.wrap{max-width:640px;margin:auto;padding:14px 12px}
.hero{text-align:center;padding:18px 10px 8px}
.hero img{width:110px;height:110px;border-radius:50%;box-shadow:0 0 22px rgba(255,0,127,.5)}
.hero h1{font-size:26px;font-weight:900;color:var(--pink);margin-top:10px}
.hero p{color:var(--muted);margin-top:4px}
.count{margin:14px 0;background:linear-gradient(135deg,#2a0016,#1e1e1e);border:1px solid var(--pink);border-radius:14px;padding:14px;text-align:center}
.count b{font-size:34px;color:var(--pink);display:block}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;display:block;width:100%;text-align:right;color:#fff}
.card h3{font-size:18px;margin-bottom:4px}
.card .muted{color:var(--muted);font-size:13px}
.card.soon{opacity:.45;cursor:default}
.card.subj{border-right:5px solid var(--c)}
.card.subj h3{color:var(--c)}
.card.subj .bar i{background:var(--c)}
.subj-ic{float:left;font-size:30px;margin-top:2px}
.chip{display:inline-block;background:var(--c);color:#000;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;margin-bottom:6px}
.cont{margin:2px 0 6px;border-color:#555}.cont small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:3px}
.new-tag{display:inline-block;background:#ff6a00;color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;margin-inline-start:6px;animation:newpulse 1.6s ease-in-out infinite}
@keyframes newpulse{50%{opacity:.55}}
.social{display:flex;gap:10px;margin:8px 0 6px}
.social a{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid #2a2a2a;border-radius:14px;background:#1a1a1a;color:#ddd;text-decoration:none;font-size:13px;font-weight:600}
.social a span{width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center}
.social a img{width:32px;height:32px}
.unit-num{display:inline-block;background:var(--pink);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;margin-bottom:6px}
.bar{height:8px;background:#333;border-radius:9px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);border-radius:9px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;color:#fff;font-size:15px;font-weight:700}
.tile span{display:block;font-size:30px;margin-bottom:6px}
.tile small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:3px}

h2.sec{font-size:16px;color:var(--pink);margin:18px 2px 10px}
.exgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.exbtn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 0;text-align:center;font-weight:700;font-size:17px;cursor:pointer;position:relative;color:#fff}
.exbtn.done{border-color:var(--ok);color:var(--ok)}
.exbtn.done::after{content:'✓';position:absolute;top:2px;left:6px;font-size:11px}
.exbtn small{display:block;font-size:10px;color:var(--muted);font-weight:400}

.paper{background:#fff;border-radius:10px;overflow:hidden;margin:10px 0}
.paper img{display:block;width:100%;height:auto}
.paper.ld{min-height:160px;position:relative}
.paper.ld::before{content:'⏳ جاري التحميل…';position:absolute;top:60px;left:0;right:0;text-align:center;color:#777}
.paper-err{background:#1e1e1e;border:1px dashed var(--warn);border-radius:10px;margin:10px 0;padding:18px;text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:6px 0}
.row{display:flex;gap:8px}
.row>*{flex:1}
.nav{display:flex;gap:8px;margin-top:12px}
.nav button{flex:1}
.empty{color:var(--muted);text-align:center;padding:20px}
.tag{display:inline-block;font-size:11px;border:1px solid #555;border-radius:20px;padding:1px 8px;color:#ccc;margin:2px}
.list-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.list-item.done{border-color:var(--ok)}

/* Zoom overlay */
#zoom{display:none;position:fixed;inset:0;background:#000;z-index:100;overflow:auto}
#zoom.open{display:block}
#zoom img{display:block;background:#fff}
#zoom .zbar{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:101}
#zoom .zbar button{background:rgba(40,40,40,.92);font-size:20px;padding:10px 16px}

/* Quiz */
.q-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}
.q-text{font-size:18px;font-weight:700;line-height:1.6;margin-bottom:14px}
.opt{display:block;width:100%;text-align:right;background:var(--card);border:1px solid #444;margin-bottom:8px;font-weight:400;font-size:16px;line-height:1.5}
.opt.right{border-color:var(--ok);background:rgba(40,167,69,.18)}
.opt.wrong{border-color:var(--bad);background:rgba(220,53,69,.18)}
.explain{background:var(--card2);border-right:4px solid var(--pink);border-radius:8px;padding:12px;margin:10px 0;line-height:1.7;font-size:14px}

/* Forms & calc */
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;font-size:16px}
.res{margin-top:16px}
.formula{background:var(--card2);border-radius:10px;padding:12px;line-height:1.9;font-size:14px;margin-bottom:10px}
.formula .ltr{font-family:Consolas,Menlo,monospace;font-size:14px}
.tbl-wrap{overflow-x:auto;background:#fff;border-radius:10px;margin:10px 0}
table.acc{border-collapse:collapse;width:100%;min-width:480px;color:#000;font-size:13px}
table.acc th,table.acc td{border:1px solid #999;padding:7px 6px;text-align:center}
table.acc th{background:#f3d1e3;font-weight:700}
table.acc td.lbl{text-align:right}
table.acc tr.datebar td{border-left:none;border-right:none;font-weight:700}
table.acc .sw{background:#fff4d6}
.verdict{border-radius:10px;padding:12px;margin:10px 0;font-weight:700}
.verdict.ok{background:rgba(40,167,69,.18);color:#6fe08b}
.verdict.bad{background:rgba(220,53,69,.18);color:#ff8a95}
.verdict.info{background:rgba(255,176,32,.14);color:var(--warn)}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:10px;font-weight:700;display:none;z-index:200;max-width:92%}
.toast.show{display:block}
.foot{color:#666;font-size:12px;text-align:center;margin-top:24px}
.sm-hot{background:linear-gradient(135deg,#3a0020,#1e1e1e);border:1px solid var(--pink);border-radius:12px;padding:12px;line-height:1.8;font-size:15px;margin:6px 0 4px}
.bacb{display:inline-block;font-size:10.5px;font-weight:700;background:rgba(255,176,32,.14);color:var(--warn);border:1px solid rgba(255,176,32,.5);border-radius:20px;padding:0 7px;margin:2px 2px;vertical-align:middle;white-space:nowrap}
h2.sec .bacb,.sm-h .bacb{font-size:10px}
.sm-h{font-size:15px;margin:16px 2px 8px;color:#fff}
.sm-p{line-height:1.8;font-size:14.5px;margin:6px 2px}
.sm-ul{margin:4px 22px 8px 4px;line-height:1.8;font-size:14.5px}
.sm-keep{background:var(--card2);border-right:4px solid var(--pink);border-radius:8px;padding:10px 12px;margin:8px 0;line-height:1.85;font-size:14.5px}
.sm-keep>b:first-child{display:block;color:var(--pink);font-size:12px;margin-bottom:2px}
.sm-trap{background:rgba(220,53,69,.12);border:1px dashed var(--bad);border-radius:10px;padding:10px 12px;margin:10px 0;line-height:1.85;font-size:14px}
.sm-trap>b:first-child{display:block;color:#ff8a95;font-size:13px;margin-bottom:2px}
.sm-link{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.45);border-radius:10px;padding:10px 12px;margin:10px 0;line-height:1.8;font-size:13.5px}
.sm-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;line-height:1.8;font-size:14.5px}
.sm-card p{margin-top:4px}
.sm-card.sm-star{border-color:var(--pink);box-shadow:0 0 12px rgba(255,0,127,.25)}
.sm-tw{overflow-x:auto;margin:8px 0}
table.sm-t{border-collapse:collapse;width:100%;font-size:13px;line-height:1.6}
table.sm-t th,table.sm-t td{border:1px solid #3a3a3a;padding:7px 6px;text-align:center;vertical-align:middle}
table.sm-t th{background:var(--pink);color:#fff;font-weight:700}
table.sm-t td{background:var(--card)}
table.sm-t td small{color:var(--muted)}
.sm-paper{background:#fff;color:#111;border-radius:10px;padding:14px;margin:10px 0;line-height:1.9;font-size:14.5px}
.sm-paper h3{font-size:16px;margin:10px 0 6px;color:#000;border-bottom:2px solid #ddd;padding-bottom:4px}
.sm-paper p{margin:6px 0}
.sm-paper table.sm-tp th{background:#f3d1e3;color:#000}
.sm-paper table.sm-tp td{background:#fff;border-color:#999}
.sm-paper table.sm-tp th{border-color:#999}
.sm-frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px}.sm-frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px 2px}.sm-frac span:last-child{padding:2px 4px 0}
.sm-f{text-align:center;margin:8px 0;font-size:13.5px}
.pts{display:inline-block;font-size:11px;background:#eee;border-radius:6px;padding:0 6px;color:#555}
</style>
</head>
<body>

<div class="top">
  <button class="back" id="backBtn" onclick="goBack()" style="display:none">→</button>
  <img src="icon-192.png" alt="">
  <div class="grow"><div class="t1" id="topTitle">أستاذ الشارع</div><div class="t2" id="topSub">تسيير واقتصاد · BAC 2027</div></div>

</div>

<div class="wrap" id="view"></div>

</div>

const PAGE_NAMES = { ex: 'التمارين', bac: 'البكالوريات', res: 'الملخص', quiz: 'الاختبار', calc: 'الحاسبات' };
function trackRoute(parts) {
  if (!parts.length) return track('/', 'الصفحة الرئيسية');
  if (parts[0] === 'acc') return track('/acc', 'المحاسبة · الوحدات');
  if (parts[0] === 'm') return track('/' + parts.join('/'), 'الرياضيات' + (parts[1] ? ' · المحور ' + parts[1] : '') + (parts[2] ? ' · ' + parts[2] : ''));
  if (BACS[parts[0]]) return track('/' + parts.join('/'), BACS[parts[0]].name + (parts[1] ? ' · ' + parts[1] : ''));
  if (parts[0] === 'ws') return track('/' + parts.join('/'), 'وضعيات شاملة' + (parts[1] ? ' · الوضعية ' + parts[1] : ''));
  if (parts[0] === 'ft') { const t = test(parts[1]); if (t) track('/' + parts.join('/'), 'فروض · ' + t.title + ' ' + t.id + (parts[2] ? ' · الموضوع ' + parts[2] : '')); return; }
  const u = unit(parts[0]); if (!u) return;
  let title = 'الوحدة ' + u.num;
  if (parts[1]) title += ' · ' + (PAGE_NAMES[parts[1]] || parts[1]);
  if (parts[2]) title += ' · ' + parts[2];
  track('/' + parts.join('/'), title);
}

  const u = unit(parts[0]);
  if (!u) return go('#/');

async function downloadUnit(uid) {
  const b = $('dlBtn'); b.disabled = true;
  const packs = [uid + '-res', uid + '-ex', uid + '-co', uid + '-bac'];
  try {
    const urls = [], old = [];
    for (const p of packs) IMGS[p] ? IMGS[p].forEach(k => urls.push(imgUrl(p, k))) : old.push(p);
    let n = 0; const tot = urls.length + old.length;
    const step = () => { b.innerText = `⏳ جاري التحميل ${Math.round(++n / tot * 100)}%…`; };
    const q = urls.slice();
    await Promise.all([0, 1, 2, 3].map(async () => {
      while (q.length) { const r = await fetch(q.shift()); if (!r.ok) throw 0; await r.blob(); step(); }
    }));
    for (const p of old) { await loadPack(p); step(); }
    b.innerText = '✅ الوحدة متوفرة بدون إنترنت';
  } catch (e) { b.disabled = false; b.innerText = '⚠️ فشل التحميل، أعد المحاولة'; }
}

<h2 class="sec">4. سعر التوازن ${bb('2017 م1', '2018 م1', '2021 م1', '2024 م1', '2026 م2')}</h2>
${keep('<p><b>سعر التوازن:</b> السعر الذي يتحقق عنده التعادل بين الكمية المطلوبة من سلعة ما والكمية المعروضة من نفس السلعة.</p>')}
<p class="sm-p">بيانيا: نقطة <b>تقاطع</b> منحنى الطلب مع منحنى العرض.</p>

<p>④ التفسير: الإشارة سالبة ← علاقة عكسية. |−0.8| أصغر من 1 ← <b>الطلب قليل المرونة</b>.</p></div>

`;

<p>1) احسب الكمية المطلوبة عند السعر 60 دج، علما أن مرونة الطلب السعرية عندما ينتقل السعر من 50 دج إلى 60 دج تساوي −1.</p>
<p>2) إذا علمت أن الكمية المعروضة عند السعر 60 دج تساوي الكمية المطلوبة عند نفس السعر، فماذا يمثل هذا السعر؟ عرّفه.</p>
<p>3) احسب مرونة الطلب السعرية عندما ينتقل السعر من 40 دج إلى 50 دج، ثم فسّر النتيجة.</p>
<p>4) احسب مرونة العرض عندما ينتقل السعر من 60 دج إلى 70 دج، ثم فسّر النتيجة.</p>
<p>5) عند السعر 60 دج، ارتفع الدخل النقدي للمستهلك من 40.000 دج إلى 50.000 دج، فانخفضت الكمية المطلوبة من السلعة (س) إلى 684 وحدة. احسب مرونة الطلب الدخلية، ثم استنتج نوع السلعة (س).</p>
<h3>الجزء الثالث (08 نقاط)</h3>
<p>يعرض «كريم» البرتقال في سوق الجملة للخضر والفواكه إلى جانب مئات التجار، وكلهم يبيعون نفس النوعية بسعر موحّد تقريبا، ولا يستطيع أي واحد منهم التأثير على السعر.</p>
<p>لاحظ كريم أنه عندما ارتفع سعر الليمون من 80 دج إلى 100 دج للكلغ، ارتفعت الكمية المطلوبة من البرتقال من 2000 كلغ إلى 2300 كلغ.</p>
<p>وفي الموسم الموالي، ارتفعت أسعار الأسمدة وأجور اليد العاملة، فقلّص الفلاحون الكميات المعروضة من البرتقال.</p>
<p>أما ابنه «أمين» فقد تخرّج حديثا ويبحث عن منصب عمل لدى إحدى المؤسسات، بينما قرّر أخوه شراء أسهم إحدى الشركات عن طريق وسيط معتمد.</p>
<p>وفي منطقتهم، تعدّ مؤسسة عمومية واحدة الجهة الوحيدة التي توزّع الكهرباء وتحدّد سعرها.</p>
<p><b>المطلوب:</b> انطلاقا من الوضعية وبناء على ما درست، أجب عن الأسئلة التالية:</p>
<p>1) استخرج أنواع الأسواق الواردة في الوضعية، وعرّف كل نوع.</p>
<p>2) ما شكل السوق الذي يتعامل فيه كريم؟ استخرج من الوضعية شرطين من شروطه.</p>
<p>3) ما شكل السوق الذي تنشط فيه المؤسسة الموزعة للكهرباء؟ عرّفه.</p>
<p>4) احسب مرونة الطلب التقاطعية بين البرتقال والليمون، ثم استنتج طبيعة العلاقة بينهما.</p>
<p>5) استخرج من الوضعية عاملا أثّر في عرض البرتقال.</p>
</div>`,
 sol: () => `
<div class="sm-paper">
<h3>الجزء الأول</h3>
<p><b>1)</b> <span class="pts">02 ن</span> <b>السوق:</b> المكان الذي يلتقي فيه البائعون والمشترون بصفة مباشرة أو عن طريق الوسطاء لتبادل السلع والخدمات.<br><b>أنواعه:</b> سوق السلع والخدمات – سوق العمل – سوق الأوراق المالية.</p>
<p><b>2)</b> <span class="pts">02 ن</span> <b>السعر:</b> التعبير النقدي لقيمة سلعة أو خدمة معينة.<br><b>العوامل المؤثرة في العرض:</b> سعر السلعة المعنية – أسعار السلع الأخرى المكملة والبديلة – أسعار عوامل الإنتاج – توقعات المنتجين.</p>
<p><b>3)</b> <span class="pts">02 ن</span> <b>مرونة الطلب التقاطعية:</b> درجة استجابة الطلب على سلعة معينة نتيجة التغير الذي يطرأ على سعر سلعة أخرى بديلة أو مكملة.<br><b>دلالتها:</b> موجبة ← سلعتان متبادلتان (بديلتان). سالبة ← سلعتان متكاملتان. معدومة ← سلعتان مستقلتان.</p>
<h3>الجزء الثاني</h3>
<p><b>1)</b> <span class="pts">1.5 ن</span> مرونة الطلب السعرية = التغير النسبي للكمية ÷ التغير النسبي للسعر<br>
التغير النسبي للسعر = (60 − 50) ÷ 50 = 0.2<br>
−1 = [(ك − 900) ÷ 900] ÷ 0.2 ← (ك − 900) ÷ 900 = −0.2 ← ك − 900 = −180 ← <b>ك = 720 وحدة</b>.</p>
<p><b>2)</b> <span class="pts">01 ن</span> السعر 60 دج يمثل <b>سعر التوازن</b>: السعر الذي يتحقق عنده التعادل بين الكمية المطلوبة والكمية المعروضة من نفس السلعة (720 وحدة).</p>
<p><b>3)</b> <span class="pts">1.25 ن</span> التغير النسبي للكمية = (900 − 1000) ÷ 1000 = −0.1. التغير النسبي للسعر = (50 − 40) ÷ 40 = 0.25.<br>
المرونة = −0.1 ÷ 0.25 = <b>−0.4</b>.<br>
التفسير: الإشارة سالبة تدل على العلاقة العكسية بين الكمية المطلوبة والسعر، و|−0.4| أصغر من 1 ← <b>الطلب قليل المرونة</b>.</p>
<p><b>4)</b> <span class="pts">1.25 ن</span> التغير النسبي للكمية المعروضة = (900 − 720) ÷ 720 = 0.25. التغير النسبي للسعر = (70 − 60) ÷ 60 ≈ 0.1667.<br>
مرونة العرض = 0.25 ÷ 0.1667 = <b>1.5</b>.<br>
التفسير: الإشارة موجبة تدل على العلاقة الطردية، و1.5 أكبر من 1 ← <b>العرض كبير المرونة</b>.</p>
<p><b>5)</b> <span class="pts">01 ن</span> التغير النسبي للكمية = (684 − 720) ÷ 720 = −0.05. التغير النسبي للدخل = (50.000 − 40.000) ÷ 40.000 = 0.25.<br>
مرونة الطلب الدخلية = −0.05 ÷ 0.25 = <b>−0.2</b> (سالبة) ← السلعة (س) <b>سلعة دنيا</b>.</p>
<h3>الجزء الثالث</h3>
<p><b>1)</b> <span class="pts">2.5 ن</span></p>
<ul class="sm-ul" style="color:#111">
<li><b>سوق السلع والخدمات</b> (سوق الجملة للخضر والفواكه، توزيع الكهرباء): المكان الذي يلتقي فيه عارضو السلع والخدمات مع طالبيها.</li>
<li><b>سوق العمل</b> (أمين يبحث عن منصب عمل): المكان الذي يلتقي فيه عارضو العمل مع طالبيه (المؤسسات).</li>
<li><b>سوق الأوراق المالية</b> (شراء الأسهم عن طريق وسيط): المكان الذي يلتقي فيه البائعون والمشترون للأسهم والسندات عن طريق سماسرة أو مؤسسات مختصة.</li>
</ul>
<p><b>2)</b> <span class="pts">1.5 ن</span> <b>سوق المنافسة الكاملة (التامة)</b>. شرطان (تقبل أي اثنين): عدد كبير جدا من البائعين – تجانس السلع وسعر موحد – صغر حجم كل بائع فلا يؤثر على السعر.</p>
<p><b>3)</b> <span class="pts">01 ن</span> <b>الاحتكار</b>: السوق التي يكون فيها بائع واحد يتحكم في عرض السلعة وسعرها.</p>
<p><b>4)</b> <span class="pts">02 ن</span> التغير النسبي لكمية البرتقال = (2300 − 2000) ÷ 2000 = 0.15. التغير النسبي لسعر الليمون = (100 − 80) ÷ 80 = 0.25.<br>
مرونة الطلب التقاطعية = 0.15 ÷ 0.25 = <b>0.6</b> (موجبة) ← البرتقال والليمون <b>سلعتان متبادلتان (بديلتان)</b>: ارتفاع سعر الليمون زاد الطلب على البرتقال.</p>
<p><b>5)</b> <span class="pts">01 ن</span> <b>أسعار عوامل الإنتاج</b> (ارتفاع أسعار الأسمدة وأجور اليد العاملة).</p>
</div>` };

SUM_HTML.e4 = () => `
<div class="sm-hot">🔥 <b>ميزان المدفوعات</b> طاح في <b>6 مواضيع</b> (مكوناته وحالاته)، و<b>مبدأ الحماية</b> في <b>4</b>. هادو هما قلب الوحدة.</div>

<h2 class="sec">1. التجارة الخارجية ${bb('2020 م1', '2022 م1', '2024 م1')}</h2>
${keep('<p><b>التجارة الخارجية:</b> مبادلة السلع والخدمات بين أشخاص طبيعيين أو معنويين يقيمون في دول مختلفة.</p>')}
<p class="sm-p"><b>أسباب قيامها</b> ${bb('2018 م2')}:</p>
<ul class="sm-ul">
 <li>عدم استطاعة أي دولة تحقيق الاكتفاء الذاتي من جميع السلع والخدمات.</li>
 <li>توسع نشاط المؤسسات وزيادة الإنتاج، والبحث عن أسواق جديدة للتصدير.</li>
 <li>تقسيم العمل الدولي (دول متخصصة في الزراعة وأخرى في الصناعة).</li>
 <li>التفاوت الكبير في أسعار عوامل الإنتاج بين الدول.</li>
 <li><b>نظرية التكاليف النسبية</b> (دافيد ريكاردو): تتخصص الدولة في المنتج اللي تكاليفه النسبية أقل وتصدّر فائضه، وتستورد ما تكاليفه عندها أعلى.</li>
</ul>
<p class="sm-p"><b>أهميتها:</b></p>
<ul class="sm-ul">
 <li>جلب العملة الصعبة عن طريق التصدير.</li>
 <li>خلق فرص عمل لامتصاص البطالة.</li>
 <li>تحقيق التكامل الاقتصادي.</li>
 <li>استيراد السلع والخدمات غير المتوفرة محليا.</li>
 <li>خلق القدرة التنافسية للمنتج المحلي لتحسين الجودة.</li>
</ul>

<h2 class="sec">2. سياسة التجارة الخارجية ${bb('2017 م2', '2018 م2', '2020 م2', '2025 م2')}</h2>
${keep('<p><b>سياسة التجارة الخارجية:</b> مجموعة الإجراءات والوسائل التي تتخذها الدولة لتعظيم العائد من علاقاتها التجارية مع العالم الخارجي، بغية تحقيق أهداف اقتصادية خلال فترة زمنية معينة.</p>')}
<div class="sm-tw"><table class="sm-t">
 <tr><th></th><th>مبدأ حرية التجارة</th><th>مبدأ الحماية</th></tr>
 <tr><td><b>واش يدعو</b></td><td>إلغاء كل القيود على التجارة الخارجية وعدم التمييز بين السلع المحلية والأجنبية</td><td>تدخل الدولة بإجراءات وقيود مختلفة على التجارة الخارجية</td></tr>
 <tr><td><b>أهدافه</b></td><td style="text-align:right">• الاستغلال الأمثل والعقلاني للثروات<br>• انخفاض الأسعار<br>• الحد من الاحتكار<br>• إنعاش التجارة وزيادة التنافس الدولي</td><td style="text-align:right">• حماية الصناعات المحلية الناشئة<br>• حماية الأسواق المحلية من سياسة الإغراق<br>• زيادة إيرادات الخزينة العمومية<br>• تقليل الواردات لتخفيف عجز ميزان المدفوعات</td></tr>
 <tr><td><b>كيفاش تعرفو</b></td><td>إلغاء الحواجز الجمركية · فتح السوق · «تنجز عمليات الاستيراد بحرية»</td><td>رفع الرسوم الجمركية · تحديد حصص الاستيراد · منع استيراد سلعة · سلع أجنبية رخيصة (إغراق)</td></tr>
</table></div>

<h2 class="sec">3. ميزان المدفوعات ${bb('2019 م2', '2023 م2', '2025 م2')}</h2>
${keep('<p><b>ميزان المدفوعات:</b> سجل تسجل فيه القيم النقدية لمختلف المعاملات الاقتصادية التي تتم بين الأعوان المقيمين في دولة ما وغير المقيمين فيها (العالم الخارجي) خلال فترة معينة، عادة سنة.</p>')}
<p class="sm-p">يقوم على <b>القيد المزدوج</b>، وفيه جانبان:</p>
<div class="sm-tw"><table class="sm-t">
 <tr><th>الجانب الدائن</th><th>الجانب المدين</th></tr>
 <tr><td>حقوق الدولة على العالم الخارجي<br><small>(دخول العملة الصعبة: تصدير، تحويلات من الخارج…)</small></td><td>التزامات الدولة تجاه العالم الخارجي<br><small>(خروج العملة الصعبة: استيراد، تحويلات نحو الخارج…)</small></td></tr>
</table></div>

<h3 class="sm-h">مكوناته</h3>
<div class="sm-card sm-star"><b>1. الحساب الجاري</b> (3 عناصر)
<p>• <b>ميزان التجارة المنظورة (الميزان التجاري):</b> صادرات وواردات <b>السلع</b>.</p>
<p>• <b>ميزان التجارة غير المنظورة (ميزان الخدمات):</b> صادرات وواردات <b>الخدمات</b> (النقل، التأمين، الاتصالات، السياحة).</p>
<p>• <b>ميزان التحويلات من طرف واحد (دون مقابل):</b> خاصة (تحويلات المهاجرين لذويهم) أو رسمية (المعاشات والتعويضات من الحكومات).</p></div>
<div class="sm-card"><b>2. حساب رأس المال</b>
<p>تغيرات أصول البلد في الخارج والأصول الأجنبية في البلد، الاستثمارات المباشرة، مشتريات ومبيعات الأوراق المالية.</p></div>
<div class="sm-card"><b>3. حساب الاحتياطات الرسمية</b>
<p>الذهب لدى الأجهزة النقدية، العملات الأجنبية، حقوق السحب الخاصة، احتياطات البلد لدى صندوق النقد الدولي.</p></div>
<h3 class="sm-h">كي تقرا في الوضعية… ← تصنّف</h3>
<div class="sm-tw"><table class="sm-t">
 <tr><th>المعاملة</th><th>المكوّن</th></tr>
 <tr><td>تصدير / استيراد سلع (بترول، تمور، آلات…)</td><td>الميزان التجاري</td></tr>
 <tr><td>سياحة · نقل · تأمين · اتصالات</td><td>ميزان الخدمات</td></tr>
 <tr><td>مهاجر يبعث دراهم لعائلتو · منحة · معاش</td><td>التحويلات من طرف واحد</td></tr>
 <tr><td>شركة أجنبية تستثمر في البلاد · شراء أسهم في الخارج</td><td>حساب رأس المال</td></tr>
 <tr><td>الذهب · احتياطي العملة الصعبة</td><td>حساب الاحتياطات الرسمية</td></tr>
</table></div>
${trap('<p>السياحة والنقل والتأمين <b>خدمات</b> ← ميزان التجارة <b>غير المنظورة</b>، ماشي الميزان التجاري. في BAC 2023 طلبو بالضبط «السياحة الشتوية ضمن أي مكوّن؟».</p>')}

<h2 class="sec">4. توازن ميزان المدفوعات ${bb('2018 م2', '2020 م2', '2021 م2')}</h2>
<p class="sm-p">ميزان المدفوعات <b>متوازن دائما محاسبيا</b> (القيد المزدوج)، لكن هذا ما يعنيش بالضرورة توازن اقتصادي:</p>
<div class="sm-tw"><table class="sm-t">
 <tr><th>الحالة</th><th>معناها</th><th>كيفاش يرجع التوازن</th></tr>
 <tr><td><b>التوازن</b></td><td>الحقوق = الالتزامات (كفاءة الأداء الاقتصادي)</td><td>—</td></tr>
 <tr><td><b>الفائض</b></td><td>الحقوق أكبر من الالتزامات (أموال غير مستثمرة)</td><td><b>زيادة</b> الأصول من الاحتياطات الرسمية بالخارج بقيمة الفائض</td></tr>
 <tr><td><b>العجز</b></td><td>الحقوق أصغر من الالتزامات (الدولة تستورد أكثر مما تسمح به مواردها)</td><td><b>تخفيض</b> الأصول من الاحتياطات الرسمية بالخارج بقيمة العجز</td></tr>
</table></div>
<p class="sm-p"><small>(إعادة التوازن عن طريق الاحتياطات تكون في ظل نظام سعر الصرف الثابت.)</small></p>

<h2 class="sec">5. المنظمة العالمية للتجارة ${bb('2018 م1', '2020 م2')}</h2>
${keep('<p><b>المنظمة العالمية للتجارة:</b> المنظمة العالمية الوحيدة التي تعنى بتنظيم القوانين التجارية بين الدول الأعضاء، وتعتبر منبرا للمفاوضات التجارية الدولية. تأسست في 01 جانفي 1995، مقرها سويسرا، وحلّت محل الاتفاقية العامة للتعريفات الجمركية والتجارة (GATT).</p>')}
<p class="sm-p"><b>دورها:</b></p>
<ul class="sm-ul">
 <li><b>تحرير التجارة الدولية</b> ومساعدة الدول النامية (مساعدات وبرامج تدريب).</li>
 <li><b>مراقبة تنفيذ الاتفاقيات</b> بين الدول ومراجعة السياسات التجارية الوطنية.</li>
 <li><b>الفصل في النزاعات التجارية:</b> مشاورات ووساطة ← شكوى من الطرف المتضرر ← فريق خاص يرفع تقريرا لجهاز تسوية المنازعات ← جهاز الطعن عند الرفض.</li>
</ul>
${trap('<p>المنظمة <b>ما تفرضش العقوبات بروحها</b>: تفوّض الأمر للطرف المتضرر.</p>')}
<p class="hint" style="margin-top:16px">المصدر: الوثيقة المرافقة للمنهاج + التصحيحات الرسمية لـ BAC 2017 – 2026</p>
`;

<p>يرسل «سفيان»، ابن مدير المؤسسة المقيم في كندا، مبلغا شهريا لعائلته في الجزائر.</p>
<p>وقد أنشأت شركة أجنبية وحدة إنتاج في الجزائر بالشراكة مع المؤسسة.</p>
<p>ومع دخول تمور أجنبية إلى السوق المحلية بأسعار منخفضة جدا تقلّ عن تكلفتها، قرّرت الدولة رفع الرسوم الجمركية على التمور المستوردة.</p>
<p><b>المطلوب:</b> انطلاقا من الوضعية وبناء على ما درست، أجب عن الأسئلة التالية:</p>
<p>1) عرّف التجارة الخارجية، ثم استخرج من الوضعية أهميتين لها.</p>
<p>2) صنّف المعاملات التالية ضمن مكونات ميزان المدفوعات، مع تحديد الجانب (دائن أو مدين) للمعاملات (أ) إلى (د):<br>
(أ) تصدير التمور – (ب) استيراد آلات التغليف – (ج) التأمين والنقل لدى الشركتين الأجنبيتين – (د) المبلغ الذي يرسله سفيان – (هـ) إنشاء الشركة الأجنبية لوحدة إنتاج في الجزائر.</p>
<p>3) ما المبدأ الذي اتبعته الدولة في الفقرة الأخيرة؟ عرّفه، واستخرج من الوضعية هدفين له.</p>
<p>4) ما المبدأ المعاكس له في سياسة التجارة الخارجية؟ اذكر هدفين له.</p>
<p>5) استخرج سببا من أسباب قيام التجارة الخارجية يظهر في استيراد آلات التغليف.</p>
</div>`,
 sol: () => `
<div class="sm-paper">
<h3>الجزء الأول</h3>
<p><b>1)</b> <span class="pts">02 ن</span> عدم استطاعة أي دولة تحقيق الاكتفاء الذاتي – توسع نشاط المؤسسات والبحث عن أسواق جديدة – تقسيم العمل الدولي – التفاوت في أسعار عوامل الإنتاج – نظرية التكاليف النسبية.</p>
<p><b>2)</b> <span class="pts">02 ن</span> <b>المنظمة العالمية للتجارة:</b> المنظمة العالمية الوحيدة التي تعنى بتنظيم القوانين التجارية بين الدول الأعضاء، وهي منبر للمفاوضات التجارية الدولية (تأسست في 01/01/1995 وحلّت محل GATT).<br><b>دورها:</b> تحرير التجارة الدولية – مراقبة تنفيذ الاتفاقيات بين الدول – الفصل في النزاعات التجارية الدولية ومتابعة تنفيذها.</p>
<p><b>3)</b> <span class="pts">02 ن</span></p>
<table class="sm-t sm-tp"><tr><th></th><th>الفائض</th><th>العجز</th></tr>
<tr><td>المعنى</td><td>حقوق الدولة على العالم الخارجي أكبر من التزاماتها</td><td>حقوق الدولة أصغر من التزاماتها</td></tr>
<tr><td>إعادة التوازن</td><td>زيادة الأصول من الاحتياطات الرسمية بالخارج بقيمة الفائض</td><td>تخفيض الأصول من الاحتياطات الرسمية بالخارج بقيمة العجز</td></tr></table>
<h3>الجزء الثالث</h3>
<p><b>1)</b> <span class="pts">1.5 ن</span> <b>التجارة الخارجية:</b> مبادلة السلع والخدمات بين أشخاص طبيعيين أو معنويين يقيمون في دول مختلفة.<br><b>أهميتان من الوضعية:</b> جلب العملة الصعبة – خلق فرص عمل (توظيف عمال جدد) – استيراد سلع غير متوفرة محليا (تقبل أي اثنتين).</p>
<p><b>2)</b> <span class="pts">2.5 ن</span></p>
<table class="sm-t sm-tp"><tr><th>المعاملة</th><th>المكوّن</th><th>الجانب</th></tr>
<tr><td>(أ) تصدير التمور</td><td>الحساب الجاري – الميزان التجاري</td><td>دائن</td></tr>
<tr><td>(ب) استيراد الآلات</td><td>الحساب الجاري – الميزان التجاري</td><td>مدين</td></tr>
<tr><td>(ج) التأمين والنقل</td><td>الحساب الجاري – ميزان الخدمات (التجارة غير المنظورة)</td><td>مدين</td></tr>
<tr><td>(د) مبلغ سفيان</td><td>الحساب الجاري – التحويلات من طرف واحد</td><td>دائن</td></tr>
<tr><td>(هـ) وحدة الإنتاج الأجنبية</td><td>حساب رأس المال (استثمار مباشر)</td><td>—</td></tr></table>
<p><b>3)</b> <span class="pts">02 ن</span> <b>مبدأ الحماية:</b> يدعو إلى تدخل الدولة عن طريق مجموعة من الإجراءات والقيود المختلفة على التجارة الخارجية لتحقيق أهداف معينة.<br><b>هدفان من الوضعية:</b> حماية الأسواق المحلية من سياسة الإغراق (تمور بأسعار تقل عن تكلفتها) – زيادة إيرادات الخزينة العمومية (الرسوم الجمركية).</p>
<p><b>4)</b> <span class="pts">01 ن</span> <b>مبدأ حرية التجارة.</b> هدفان (تقبل أي اثنين): الاستغلال الأمثل والعقلاني للثروات – انخفاض الأسعار – الحد من الاحتكار – إنعاش التجارة وزيادة التنافس الدولي.</p>
<p><b>5)</b> <span class="pts">01 ن</span> عدم استطاعة أي دولة تحقيق الاكتفاء الذاتي من جميع السلع والخدمات (الآلات غير متوفرة في السوق المحلية).</p>
</div>` };

SUM_HTML.e5 = () => `
<div class="sm-hot">🔥 <b>سوق الصرف وأنواعه</b> طاح في <b>4 مواضيع</b>، و<b>التحويل من عملة لعملة</b> (حساب) في <b>3</b>. وحدة قصيرة ونقاطها مضمونة.</div>

${keep('<p><b>الصرف:</b> مبادلة عملة دولة ما مقابل عملة دولة أخرى (مثل الدينار الجزائري مقابل الدولار).</p>')}

 <tr><th>سوق الصرف بين البنوك</th><th>السوق العالمي للصرف</th></tr>

<p class="sm-p">كي تشوف في الوضعية «1 دولار = 145 دج» ويسقسيك «ماذا يمثل؟» ← <b>سعر الصرف</b>، وتكتب التعريف.</p>

<h3 class="sm-h">التحويل (حساب) ${bb('2018 م1', '2022 م1', '2023 م1')}</h3>
<div class="sm-tw"><table class="sm-t">
 <tr><th>عندك</th><th>تحب</th><th>تدير</th></tr>
 <tr><td>مبلغ بالعملة الأجنبية</td><td>بالدينار</td><td><b>× سعر الصرف</b></td></tr>

</table></div>
<div class="sm-card"><p>مثال: 285.600 أورو و1 أورو = 136,25 دج ← 285.600 × 136,25 = <b>38.913.000 دج</b> (BAC 2018).</p>
<p>مثال: آلة بـ 1.610.000 دج و1 دولار = 140 دج ← 1.610.000 ÷ 140 = <b>11.500 دولار</b> (BAC 2023).</p></div>
${trap('<p>كي يقولو «تدهور سعر الصرف» ولا «انخفاض قيمة الدينار» ← نفس المبلغ بالعملة الأجنبية <b>يكلّف دينارات أكثر</b>، يعني <b>تكلفة الاستيراد ترتفع</b>.</p>')}

<h2 class="sec">4. أنظمة الصرف ${bb('2019 م1')}</h2>
<div class="sm-tw"><table class="sm-t">
 <tr><th>نظام الصرف الثابت</th><th>نظام الصرف المرن (المتغير)</th></tr>

</table></div>

<h2 class="sec">5. سياسة الصرف ${bb('2018 م2', '2023 م2')}</h2>
${keep('<p><b>سياسة سعر الصرف:</b> مجموعة الإجراءات والتدابير والوسائل التي تتخذها السلطات النقدية للبلد في مجال الصرف بغية تحقيق أهداف معينة.</p>')}
<p class="sm-p"><b>أهدافها:</b> تنمية الصناعات المحلية – تشجيع الصادرات – التحكم في الواردات – معالجة التضخم – تحقيق التوازن في ميزان المدفوعات.</p>
<p class="sm-p"><b>وسائلها:</b></p>
<div class="sm-card sm-star"><b>1. تعديل سعر الصرف</b> ${bb('2023 م2')}<p>خفض أو رفع قيمة العملة الوطنية تجاه العملات الأجنبية.</p>
<p>• <b>تخفيض</b> قيمة العملة الوطنية ← تزيد الصادرات وتنخفض الواردات ← تشجيع الصناعات المحلية.</p>
<p>• <b>رفع</b> قيمتها ← تزيد الواردات ← منافسة وانخفاض الأسعار ← تقليل حدة التضخم.</p></div>
<div class="sm-card"><b>2. استخدام احتياطات الصرف</b><p>العملات الأجنبية التي بحوزة السلطة النقدية للتدخل في سوق الصرف:</p>
<p>• قيمة العملة الوطنية <b>انخفضت</b> ← تبيع العملات الأجنبية وتشتري العملة الوطنية ← ترتفع قيمتها.</p>
<p>• قيمة العملة الوطنية <b>ارتفعت</b> ← تبيع العملة الوطنية وتشتري العملات الأجنبية ← تنخفض قيمتها.</p></div>
<div class="sm-card"><b>3. مراقبة الصرف</b><p>قيود على استخدام الصرف الأجنبي للحد من خروج رؤوس الأموال والمحافظة على استقرار سعر صرف العملة الوطنية، وتحقيق التوازن في ميزان المدفوعات.</p></div>
<div class="sm-card"><b>4. استخدام أسعار الفائدة</b><p>• انخفاضها (مع فرص استثمار) ← طلب على رؤوس الأموال وتنشيط الاقتصاد ← ترتفع قيمة العملة الوطنية.</p>
<p>• ارتفاعها ← تجنب الاقتراض ← أثر سلبي على النمو وعلى قيمة العملة الوطنية.</p></div>
<div class="sm-link">🔗 <b>رابط مع التجارة الخارجية</b>: التدفقات من العملة الأجنبية الناتجة عن السياحة تدرج في <b>الجانب الدائن</b> لميزان المدفوعات (BAC 2023).</div>
<p class="hint" style="margin-top:16px">المصدر: الوثيقة المرافقة للمنهاج + التصحيحات الرسمية لـ BAC 2017 – 2026</p>
`;

SUG_HTML.e5 = {
 subj: () => `

 sol: () => `

let zoomOpen = false, zoomW = 1;
function openZoom(src) {
  $('zoomImg').src = src; zoomW = 2; applyZoom(); $('zoom').classList.add('open'); $('zoom').scrollTo(0, 0);
  zoomOpen = true; history.pushState({ zoom: 1 }, '');
}
function applyZoom() { $('zoomImg').style.width = (zoomW * 100) + 'vw'; }
function zoomBy(f) { zoomW = Math.min(5, Math.max(1, zoomW * f)); applyZoom(); }
function hideZoom() { zoomOpen = false; $('zoom').classList.remove('open'); }
function closeZoom() { if (history.state && history.state.zoom) history.back(); else hideZoom(); }

/* ---------- Quiz ---------- */
let Q = null;
function renderQuiz(v, u) {
  setTop('❓ اختبر نفسك', 'الوحدة ' + u.num, true);
  const order = u.quiz.map((_, i) => i).sort(() => Math.random() - .5);
  Q = { u, order, i: 0, score: 0, answered: false };
  quizStep();
}
function quizStep() {
  const v = $('view'), { u, order, i } = Q;
  if (i >= order.length) return quizEnd();
  const q = u.quiz[order[i]];
  const opts = q.o.map((t, j) => ({ t, j })).sort(() => Math.random() - .5);
  Q.answered = false;
  v.innerHTML = `
    <div class="q-head"><span>السؤال ${i + 1} / ${order.length}</span><span>النتيجة: ${Q.score}</span></div>
    <div class="bar" style="margin:0 0 16px"><i style="width:${i / order.length * 100}%"></i></div>
    <div class="q-text">${esc(q.q)}</div>
    ${opts.map(o => `<button class="opt" data-j="${o.j}" onclick="quizAnswer(this,${o.j})">${esc(o.t)}</button>`).join('')}
    <div id="qx"></div>`;
}
function quizAnswer(btn, j) {
  if (Q.answered) return; Q.answered = true;
  const q = Q.u.quiz[Q.order[Q.i]], ok = j === q.a;
  if (ok) Q.score++;
  document.querySelectorAll('.opt').forEach(b => { if (+b.dataset.j === q.a) b.classList.add('right'); });
  if (!ok) btn.classList.add('wrong');
  $('qx').innerHTML = `<div class="explain">${ok ? '✅ إجابة صحيحة!' : '❌ إجابة خاطئة.'}<br>${esc(q.e)}</div>
    <button class="btn-pink w100" onclick="Q.i++;quizStep();window.scrollTo(0,0)">${Q.i + 1 < Q.order.length ? 'السؤال التالي ←' : 'النتيجة النهائية 🏁'}</button>`;
}
function quizEnd() {
  const { u, score, order } = Q, total = order.length;
  const best = Math.max(score, store.get('quiz_' + u.id, 0)); store.set('quiz_' + u.id, best);
  const r = score / total;
  const msg = r >= .9 ? 'ممتاز! أنت جاهز للبكالوريا 🏆' : r >= .7 ? 'جيد جداً! راجع الأخطاء وستصل للعلامة الكاملة 💪' : r >= .5 ? 'لا بأس، راجع الملخص ثم أعد المحاولة 📖' : 'راجع الملخص جيداً ثم أعد الاختبار، ستتحسن 💪';
  $('view').innerHTML = `<div class="count"><b>${score} / ${total}</b>${msg}</div>
    <p class="hint">أفضل نتيجة لك: ${best} / ${total}</p>
    <button class="btn-pink w100" onclick="renderQuiz($('view'), unit('${u.id}'))">🔄 أعد الاختبار</button>
    <button class="btn-line w100" style="margin-top:8px" onclick="go('#/${u.id}/res')">📖 راجع الملخص</button>`;
}

function need(...vals) { if (vals.some(x => !isFinite(x) || x < 0)) { $('out').innerHTML = '<div class="verdict bad">⚠️ تأكد من إدخال كل القيم بشكل صحيح.</div>'; return false; } return true; }
function dmy(y, m, d) { return L(`${y}/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}`); }
function yEnd(y) { return dmy(y, 12, 31); }
// Règle du mois : acquisition du 1 au 15 → mois compté ; du 16 à la fin → non compté
function firstMonths(dateStr) { const [y, m, d] = dateStr.split('-').map(Number); return { y, m, d, months: d <= 15 ? 13 - m : 12 - m }; }

function planTable(rows, extra) {

    ? '<tr><th>السنة (N)</th><th>أساس الحساب</th><th>المعدل المطبق</th><th>قسط الاهتلاك (An)</th><th>الاهتلاك المتراكم</th><th>القيمة المحاسبية الصافية (VNC)</th><th>الطريقة</th></tr>'
    : '<tr><th>السنة (N)</th><th>المبلغ القابل للاهتلاك (MA)</th><th>قسط الاهتلاك (An)</th><th>الاهتلاك المتراكم</th><th>القيمة المحاسبية الصافية (VNC)</th></tr>';
  return `<div class="tbl-wrap"><table class="acc">${head}${rows.join('')}</table></div><p class="hint">اسحب الجدول يميناً ويساراً إذا لزم الأمر ↔</p>`;
}
function journal(date, debits, credits, note) {

  const cl = credits.map(([acc, name, amt], i) => `<tr><td></td><td>${acc}</td><td class="lbl" style="padding-right:${i ? 26 : 18}px">${i ? '' : 'إلى '}حـ/ ${name}</td><td></td><td>${fmt(amt)}</td></tr>`).join('');
  return `<div class="tbl-wrap"><table class="acc"><tr><th>مدين</th><th>دائن</th><th>البيان</th><th>مبالغ مدينة</th><th>مبالغ دائنة</th></tr>

    <tr><td colspan="5" style="color:#555">(${note})</td></tr></table></div>`;

function calc_lin() {
  const MA = num('c-ma'); let N = num('c-n'); const t0 = num('c-t');
  if (!isFinite(N) && isFinite(t0) && t0 > 0) N = 100 / t0;
  if (!need(MA, N) || !$('c-date').value || N <= 0) return need(NaN);
  const t = 1 / N, An = MA * t, f = firstMonths($('c-date').value), code = $('c-asset').value;
  const rows = []; let sa = 0, y = f.y, left = N * 12, firstAmt = 0;
  while (left > 0.0001 && rows.length < 60) {
    const m = rows.length === 0 ? Math.min(f.months, left) : Math.min(12, left);
    let a = An * m / 12; if (left - m <= 0.0001) a = MA - sa;
    sa += a; left -= m; if (!rows.length) firstAmt = a;
    rows.push(`<tr><td>${yEnd(y)}${m < 12 ? `<br><small>(${m} أشهر)</small>` : ''}</td><td>${fmt(MA)}</td><td>${fmt(a)}</td><td>${fmt(sa)}</td><td>${fmt(MA - sa)}</td></tr>`);
    y++;
  }
  $('out').innerHTML = `<div class="formula">
      المعدل: ${L(`t = 100% / N = 100 / ${fmt(N)} = ${pct(t)}`)}<br>
      القسط السنوي: ${L(`An = MA × t = ${fmt(MA)} × ${fmt(t)} = ${fmt(An)} DA`)}<br>
      ${f.months < 12 ? `السنة الأولى (${f.months} أشهر): ${L(`A(${f.y}) = ${fmt(MA)} × ${fmt(t)} × (${f.months}/12) = ${fmt(firstAmt)} DA`)}` : 'السنة الأولى كاملة (12 شهراً).'}
    </div>${planTable(rows)}
    <h2 class="sec">قيد قسط السنة الأولى</h2>
    ${journal(yEnd(f.y), [['681', 'مخصصات الاهتلاكات والمؤونات وخسائر القيمة – الأصول غير الجارية', firstAmt]], [[amortAcc(code), 'اهتلاك ' + assetName(code), firstAmt]], 'إثبات قسط اهتلاك دورة ' + f.y)}`;
}

function calc_deg() {
  const MA = num('c-ma'), N = num('c-n');

  const coef = N <= 4 ? 1.5 : N <= 6 ? 2 : 2.5, t = 1 / N, td = t * coef;
  const f = firstMonths($('c-date').value), code = $('c-asset').value;
  const rows = []; let vnc = MA, sa = 0, y = f.y, left = N * 12, linear = false, linAnnual = 0, linRateFix = 0, firstAmt = 0, switchYear = null;
  while (left > 0.0001 && rows.length < 60) {
    const m = rows.length === 0 ? Math.min(f.months, left) : Math.min(12, left);
    const linRate = 12 / left;
    if (!linear && linRate >= td - 1e-9) { linear = true; linAnnual = vnc * 12 / left; linRateFix = linRate; switchYear = y; }
    const base = vnc;
    let a = linear ? linAnnual * m / 12 : vnc * td * m / 12;
    if (left - m <= 0.0001) a = vnc;
    sa += a; vnc -= a; left -= m; if (!rows.length) firstAmt = a;
    rows.push(`<tr class="${y === switchYear ? 'sw' : ''}"><td>${yEnd(y)}${m < 12 ? `<br><small>(${m} أشهر)</small>` : ''}</td><td>${fmt(base)}</td><td>${linear ? pct(linRateFix) : pct(td)}${m < 12 ? ` × ${m}/12` : ''}</td><td>${fmt(a)}</td><td>${fmt(sa)}</td><td>${fmt(Math.max(vnc, 0))}</td><td>${linear ? 'خطي' : 'متناقص'}</td></tr>`);
    y++;
  }
  $('out').innerHTML = `<div class="formula">
      المعدل الخطي: ${L(`t = 100 / ${fmt(N)} = ${pct(t)}`)}<br>
      المعامل الجبائي (${N <= 4 ? '3 أو 4 سنوات' : N <= 6 ? '5 أو 6 سنوات' : 'أكثر من 6 سنوات'}) = ${L(coef)}<br>
      المعدل المتناقص: ${L(`t′ = ${pct(t)} × ${coef} = ${pct(td)}`)}<br>
      ${switchYear ? `التحول للخطي ابتداءً من سنة ${switchYear} (المعدل الخطي للمدة المتبقية ≥ ${pct(td)}) — السطر الملوّن.` : ''}
    </div>${planTable(rows, 'deg')}
    <h2 class="sec">قيد قسط السنة الأولى</h2>
    ${journal(yEnd(f.y), [['681', 'مخصصات الاهتلاكات والمؤونات وخسائر القيمة – الأصول غير الجارية', firstAmt]], [[amortAcc(code), 'اهتلاك ' + assetName(code), firstAmt]], 'إثبات قسط اهتلاك دورة ' + f.y)}`;
}

function calc_pro() {
  const MA = num('c-ma'), N = Math.round(num('c-n')), y0 = Math.round(num('c-y'));
  if (!need(MA, N, y0) || N < 1) return;
  const S = N * (N + 1) / 2, code = $('c-asset').value, rows = []; let sa = 0;
  for (let k = 1; k <= N; k++) {
    const a = k === N ? MA - sa : MA * k / S; sa += a;
    rows.push(`<tr><td>${y0 + k - 1} ${L(`(${k}/${S})`)}</td><td>${fmt(MA)}</td><td>${fmt(a)}</td><td>${fmt(sa)}</td><td>${fmt(MA - sa)}</td></tr>`);
  }
  $('out').innerHTML = `<div class="formula">
      مجموع أرقام السنوات: ${L(`S = N × (N + 1) / 2 = ${N} × ${N + 1} / 2 = ${S}`)}<br>
      قسط السنة k: ${L(`Ak = MA × k / ${S}`)}<br>
      السنة الأولى: ${L(`A1 = ${fmt(MA)} × 1/${S} = ${fmt(MA / S)} DA`)}
    </div>${planTable(rows)}
    <h2 class="sec">قيد قسط السنة الأولى</h2>
    ${journal(yEnd(y0), [['681', 'مخصصات الاهتلاكات والمؤونات وخسائر القيمة – الأصول غير الجارية', MA / S]], [[amortAcc(code), 'اهتلاك ' + assetName(code), MA / S]], 'إثبات قسط اهتلاك دورة ' + y0)}`;
}

function calc_pv() {
  const MA = num('c-ma'), SA = num('c-sa'), PV0 = isFinite(num('c-pv0')) ? num('c-pv0') : 0, PVN = num('c-pvn'), Nr = num('c-nr'), y = isFinite(num('c-y')) ? num('c-y') : '';

  const code = $('c-asset').value, vnc = MA - SA - PV0;
  let html = `<div class="formula">${L(`VNC = MA − ΣA${PV0 ? ' − PV' : ''} = ${fmt(MA)} − ${fmt(SA)}${PV0 ? ' − ' + fmt(PV0) : ''} = ${fmt(vnc)} DA`)}<br>${L(`PVN = ${fmt(PVN)} DA`)}</div>`;
  if (PVN >= vnc) {
    html += `<div class="verdict ok">✔ ${L('PVN ≥ VNC')} ← لا توجد خسارة قيمة، ولا يُسجَّل أي قيد.</div>`;
  } else {
    const pv = vnc - PVN, newVnc = PVN;

    html += '<h2 class="sec">قيد معاينة خسارة القيمة</h2>' + journal(y ? yEnd(y) : '31/12', [['681', 'مخصصات الاهتلاكات والمؤونات وخسائر القيمة – الأصول غير الجارية', pv]], [[lossAcc(code), 'خسائر القيمة عن ' + assetName(code), pv]], 'إثبات خسارة القيمة للدورة');
    html += `<div class="formula">القيمة المحاسبية الصافية الجديدة: ${L(`VNC = ${fmt(newVnc)} DA`)}`;
    if (isFinite(Nr) && Nr > 0) html += `<br>القسط المعدّل للسنوات المتبقية: ${L(`An = VNC / Nr = ${fmt(newVnc)} / ${fmt(Nr)} = ${fmt(newVnc / Nr)} DA`)}`;
    else html += '<br>أدخل Nr (السنوات المتبقية) لحساب القسط المعدّل.';
    html += '</div>';
  }
  $('out').innerHTML = html;
}

function calc_ces() {

  if (!need(MA, SA, P) || !$('c-date').value) return;

const A685 = ['685', 'المخصصات للاهتلاكات والمؤونات وخسائر القيمة – الأصول الجارية'];

function calc_ecart() {

function calc_dep() {
  const k = $('c-stock').value, st = STOCKS[k], phy = num('c-phy'), mkt = num('c-mkt'), prev = isFinite(num('c-prev')) ? num('c-prev') : 0, y = num('c-y');

  let kind;

  if (adj > 0) html += '<h2 class="sec">قيد التسوية</h2>' + journal(yEnd(y), [[...A685, adj]], [[...st.p39, adj]], (prev ? 'زيادة' : 'إثبات') + ' خسارة القيمة – ' + st.name);
  if (adj < 0) html += '<h2 class="sec">قيد التسوية</h2>' + journal(yEnd(y), [[...st.p39, -adj]], [[...A785, -adj]], (cur ? 'إنقاص' : 'إلغاء') + ' خسارة القيمة – ' + st.name);

function calc_smv() {

    التعديل = خ ق الحالية − خ ق السابقة = ${L(`${fmt(cur)} − ${fmt(prev)} = ${adj > 0 ? '+' : ''}${fmt(adj)} DA`)}</div>`;
  let kind;

  }
  if (j.length) html += '<h2 class="sec">قيود التسوية</h2>' + j.join('');
  if (cur && ttc) html += `<h2 class="sec">في الميزانية الختامية</h2><div class="tbl-wrap"><table class="acc"><tr><th>الأصول الجارية</th><th>الإجمالي</th><th>خسائر القيمة</th><th>الصافي</th></tr>
    <tr><td class="lbl">الزبائن المشكوك فيهم (هذا الزبون)</td><td>${fmt(ttc)}</td><td>${fmt(cur)}</td><td>${fmt(r2(ttc - cur))}</td></tr></table></div>`;
  $('out').innerHTML = html;
}

/* ============================================================
   Installation & hors ligne
   ============================================================ */
let installEvent = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; $('installBtn').style.display = 'block'; });
window.addEventListener('appinstalled', () => { $('installBtn').style.display = 'none'; track('install', 'تثبيت التطبيق', true); });
async function installApp() { if (!installEvent) return; installEvent.prompt(); await installEvent.userChoice; installEvent = null; $('installBtn').style.display = 'none'; }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

if (isInstalled()) track('open-app', 'فتح التطبيق من الأيقونة', true);
if (GC_REF === 'partage') track('from-share', 'جا عن طريق زر المشاركة', true);
render();
</script>
