<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>أستاذ الشارع | فضاء التلميذ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--card:#1e1e1e;--card2:#262626;--pink:#ff007f;--txt:#fff;--muted:#a9a9a9;--ok:#28a745;--bad:#dc3545;--warn:#ffb020;--line:#333}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--txt);min-height:100vh;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
button{border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:15px;padding:12px 14px;color:#fff;background:#333;transition:.15s}
button:active{transform:scale(.97)}
.btn-pink{background:var(--pink);box-shadow:0 0 10px rgba(255,0,127,.35)}
.btn-ok{background:rgba(40,167,69,.18);color:var(--ok);border:1px solid var(--ok)}
.btn-line{background:transparent;border:1px solid #444;color:var(--muted)}
.w100{width:100%}
a{color:var(--pink)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:#000;border-bottom:2px solid var(--pink);display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
.top img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 10px rgba(255,0,127,.4)}
.top .t1{font-weight:900;color:var(--pink);font-size:18px;line-height:1.1}
.top .t2{font-size:12px;color:var(--muted)}
.top .back{background:transparent;font-size:22px;padding:4px 8px;color:#fff}
.top .grow{flex:1;min-width:0}
.top .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#installBtn{display:none;background:var(--pink);font-size:12px;padding:8px 10px}

.wrap{max-width:640px;margin:auto;padding:14px 12px}
.hero{text-align:center;padding:18px 10px 8px}
.hero img{width:110px;height:110px;border-radius:50%;box-shadow:0 0 22px rgba(255,0,127,.5)}
.hero h1{font-size:26px;font-weight:900;color:var(--pink);margin-top:10px}
.hero p{color:var(--muted);margin-top:4px}
.count{margin:14px 0;background:linear-gradient(135deg,#2a0016,#1e1e1e);border:1px solid var(--pink);border-radius:14px;padding:14px;text-align:center}
.count b{font-size:34px;color:var(--pink);display:block}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;display:block;width:100%;text-align:right;color:#fff}
.card h3{font-size:18px;margin-bottom:4px}
.card .muted{color:var(--muted);font-size:13px}
.card.soon{opacity:.45;cursor:default}
.unit-num{display:inline-block;background:var(--pink);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;margin-bottom:6px}
.bar{height:8px;background:#333;border-radius:9px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);border-radius:9px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;color:#fff;font-size:15px;font-weight:700}
.tile span{display:block;font-size:30px;margin-bottom:6px}
.tile small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:3px}

h2.sec{font-size:16px;color:var(--pink);margin:18px 2px 10px}
.exgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.exbtn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 0;text-align:center;font-weight:700;font-size:17px;cursor:pointer;position:relative;color:#fff}
.exbtn.done{border-color:var(--ok);color:var(--ok)}
.exbtn.done::after{content:'✓';position:absolute;top:2px;left:6px;font-size:11px}
.exbtn small{display:block;font-size:10px;color:var(--muted);font-weight:400}

.paper{background:#fff;border-radius:10px;overflow:hidden;margin:10px 0}
.paper img{display:block;width:100%;height:auto}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:6px 0}
.row{display:flex;gap:8px}
.row>*{flex:1}
.nav{display:flex;gap:8px;margin-top:12px}
.nav button{flex:1}
.empty{color:var(--muted);text-align:center;padding:20px}
.tag{display:inline-block;font-size:11px;border:1px solid #555;border-radius:20px;padding:1px 8px;color:#ccc;margin:2px}
.list-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.list-item.done{border-color:var(--ok)}

/* Zoom overlay */
#zoom{display:none;position:fixed;inset:0;background:#000;z-index:100;overflow:auto}
#zoom.open{display:block}
#zoom img{display:block;background:#fff}
#zoom .zbar{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:101}
#zoom .zbar button{background:rgba(40,40,40,.92);font-size:20px;padding:10px 16px}

/* Quiz */
.q-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}
.q-text{font-size:18px;font-weight:700;line-height:1.6;margin-bottom:14px}
.opt{display:block;width:100%;text-align:right;background:var(--card);border:1px solid #444;margin-bottom:8px;font-weight:400;font-size:16px;line-height:1.5}
.opt.right{border-color:var(--ok);background:rgba(40,167,69,.18)}
.opt.wrong{border-color:var(--bad);background:rgba(220,53,69,.18)}
.explain{background:var(--card2);border-right:4px solid var(--pink);border-radius:8px;padding:12px;margin:10px 0;line-height:1.7;font-size:14px}

/* Forms & calc */
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;font-size:16px}
.res{margin-top:16px}
.formula{background:var(--card2);border-radius:10px;padding:12px;line-height:1.9;font-size:14px;margin-bottom:10px}
.formula .ltr{font-family:Consolas,Menlo,monospace;font-size:14px}
.tbl-wrap{overflow-x:auto;background:#fff;border-radius:10px;margin:10px 0}
table.acc{border-collapse:collapse;width:100%;min-width:480px;color:#000;font-size:13px}
table.acc th,table.acc td{border:1px solid #999;padding:7px 6px;text-align:center}
table.acc th{background:#f3d1e3;font-weight:700}
table.acc td.lbl{text-align:right}
table.acc tr.datebar td{border-left:none;border-right:none;font-weight:700}
table.acc .sw{background:#fff4d6}
.verdict{border-radius:10px;padding:12px;margin:10px 0;font-weight:700}
.verdict.ok{background:rgba(40,167,69,.18);color:#6fe08b}
.verdict.bad{background:rgba(220,53,69,.18);color:#ff8a95}
.verdict.info{background:rgba(255,176,32,.14);color:var(--warn)}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:10px;font-weight:700;display:none;z-index:200;max-width:92%}
.toast.show{display:block}
.foot{color:#666;font-size:12px;text-align:center;margin-top:24px}
</style>
</head>

   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { const r = Math.round(n * 100) / 100; const [i, d] = Math.abs(r).toFixed(2).split('.'); const s = i.replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (r < 0 ? '-' : '') + s + (d === '00' ? '' : '.' + d); };
const L = s => `<span class="ltr">${s}</span>`;
const pct = x => fmt(x * 100) + '%';
const num = id => { const v = String($(id).value).replace(/[\s,]/g, '').replace('٫', '.'); return v === '' ? NaN : +v; };
const unit = id => UNITS.find(u => u.id === id);
const nEx = n => n + (n >= 3 && n <= 10 ? ' تمارين' : ' تمرين');
const store = {
  get(k, d) { try { const v = localStorage.getItem('elv_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('elv_' + k, JSON.stringify(v)); } catch (e) {} },
};
function toast(t) { const el = $('toast'); el.innerText = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200); }

/* Chargement des fichiers de contenu (images) */
const loading = {};
function loadPack(name) {
  if (window.PACKS && PACKS[name]) return Promise.resolve(PACKS[name]);
  if (!loading[name]) loading[name] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = name + '.js';
    s.onload = () => res(PACKS[name]);
    s.onerror = () => { delete loading[name]; s.remove(); rej(); };
    document.head.appendChild(s);
  });
  return loading[name];
}
async function img(pack, key, alt) {
  try { const p = await loadPack(pack); return p[key] ? `<div class="paper"><img src="${p[key]}" alt="${esc(alt || '')}" onclick="openZoom(this.src)"></div>` : ''; }
  catch (e) { return '<p class="empty">⚠️ تعذّر التحميل. تحقق من الاتصال بالإنترنت ثم أعد المحاولة.</p>'; }
}

/* Progression */
const doneSet = uid => new Set(store.get('done_' + uid, []));
function toggleDone(uid, k) {
  const s = doneSet(uid); s.has(k) ? s.delete(k) : s.add(k);
  store.set('done_' + uid, [...s]);
  return s.has(k);
}

/* ============================================================
   Navigation (le bouton retour d'Android fonctionne)
   ============================================================ */
function go(h) { location.hash = h; }
function goBack() { history.length > 1 ? history.back() : go('#/'); }
window.addEventListener('hashchange', () => { if (zoomOpen) { hideZoom(); } render(); });

function setTop(title, sub, back) {
  $('topTitle').innerText = title; $('topSub').innerText = sub || '';
  $('backBtn').style.display = back ? 'block' : 'none';
}

async function render() {
  const parts = (location.hash || '#/').slice(2).split('/').filter(Boolean);
  const v = $('view');
  window.scrollTo(0, 0);
  if (!parts.length) return renderHome(v);
  const u = unit(parts[0]);
  if (!u) return go('#/');
  if (!parts[1]) return renderUnit(v, u);
  if (parts[1] === 'ex') return parts[2] ? renderExercise(v, u, parts[2]) : renderExList(v, u);
  if (parts[1] === 'bac') return parts[2] ? renderBac(v, u, parts[2]) : renderBacList(v, u);
  if (parts[1] === 'res') return renderRes(v, u);
  if (parts[1] === 'quiz') return renderQuiz(v, u);
  if (parts[1] === 'calc') return renderCalc(v, u, parts[2]);
  go('#/');
}

/* ---------- Unité ---------- */
function renderUnit(v, u) {
  setTop('الوحدة ' + u.num, u.title, true);
  const total = u.axes[u.axes.length - 1].to, d = doneSet(u.id).size;
  const best = store.get('quiz_' + u.id, null);
  v.innerHTML = `
    <div class="card" style="cursor:default"><span class="unit-num">الوحدة ${u.num}</span><h3>${esc(u.title)}</h3>
      <div class="bar"><i style="width:${Math.round(d / total * 100)}%"></i></div><div class="muted" style="margin-top:6px">أنجزت ${d} / ${nEx(total)}</div></div>
    <div class="grid">
      <div class="tile" onclick="go('#/${u.id}/res')"><span>📖</span>الملخص<small>القوانين والقواعد</small></div>
      <div class="tile" onclick="go('#/${u.id}/ex')"><span>✏️</span>التمارين<small>${nEx(total)} مع الحل</small></div>
      <div class="tile" onclick="go('#/${u.id}/bac')"><span>🎓</span>البكالوريات<small>${u.bac.length} موضوع مع التصحيح</small></div>
      <div class="tile" onclick="go('#/${u.id}/quiz')"><span>❓</span>اختبر نفسك<small>${best ? 'أفضل نتيجة: ' + best + '/' + u.quiz.length : u.quiz.length + ' سؤال'}</small></div>
      <div class="tile" style="grid-column:1/-1" onclick="go('#/${u.id}/calc')"><span>🧮</span>الحاسبات<small>${u.calcHint}</small></div>
    </div>
    <button class="btn-line w100" style="margin-top:16px" id="dlBtn" onclick="downloadUnit('${u.id}')">⬇️ تحميل الوحدة للاستعمال بدون إنترنت</button>`;
}
async function downloadUnit(uid) {
  const b = $('dlBtn'); b.disabled = true;
  const packs = [uid + '-res', uid + '-ex', uid + '-co', uid + '-bac'];
  try {
    for (let i = 0; i < packs.length; i++) { b.innerText = `⏳ جاري التحميل ${i + 1}/${packs.length}…`; await loadPack(packs[i]); }
    b.innerText = '✅ الوحدة متوفرة بدون إنترنت';
  } catch (e) { b.disabled = false; b.innerText = '⚠️ فشل التحميل، أعد المحاولة'; }
}

/* ---------- Résumé ---------- */
async function renderRes(v, u) {
  setTop('📖 الملخص', 'الوحدة ' + u.num, true);
  v.innerHTML = '<p class="empty">⏳ جاري التحميل…</p>';
  let html = '<p class="hint">اضغط على أي صفحة لتكبيرها 🔍</p>';
  for (const k of u.resPages) html += await img(u.id + '-res', k, 'ملخص');
  v.innerHTML = html;
}

/* ---------- Exercices ---------- */
function renderExList(v, u) {
  setTop('✏️ التمارين', 'الوحدة ' + u.num, true);
  const done = doneSet(u.id);
  v.innerHTML = '<p class="hint">✓ = تمرين أنجزته</p>' + u.axes.map(a => {
    let b = '';
    for (let i = a.from; i <= a.to; i++) {
      const k = String(i).padStart(2, '0');
      const lbl = u.exLabels[k] ? `<small>${u.exLabels[k].replace('بكالوريا ', '')}</small>` : '';
      b += `<div class="exbtn ${done.has(k) ? 'done' : ''}" onclick="go('#/${u.id}/ex/${k}')">${k}${lbl}</div>`;
    }
    return `<h2 class="sec">${esc(a.title)}</h2><div class="exgrid">${b}</div>`;
  }).join('');
}
async function renderExercise(v, u, k) {
  const n = +k, total = u.axes[u.axes.length - 1].to;
  const axis = u.axes.find(a => n >= a.from && n <= a.to);
  setTop('التمرين ' + k, axis ? axis.title.split(':')[0] : '', true);
  v.innerHTML = '<p class="empty">⏳ جاري التحميل…</p>';
  const exHtml = await img(u.id + '-ex', 'ex' + k, 'التمرين ' + k);
  const c = u.corr[k];
  const done = doneSet(u.id).has(k);
  const prev = n > 1 ? String(n - 1).padStart(2, '0') : null, next = n < total ? String(n + 1).padStart(2, '0') : null;
  const video = u.videos[k] ? `<a href="${u.videos[k]}" target="_blank"><button class="btn-line w100" style="margin-top:8px">🎬 شاهد شرح التمرين</button></a>` : '';
  v.innerHTML = `

/* ---------- Quiz ---------- */
let Q = null;
function renderQuiz(v, u) {
  setTop('❓ اختبر نفسك', 'الوحدة ' + u.num, true);
  const order = u.quiz.map((_, i) => i).sort(() => Math.random() - .5);
  Q = { u, order, i: 0, score: 0, answered: false };
  quizStep();
}
function quizStep() {
  const v = $('view'), { u, order, i } = Q;
  if (i >= order.length) return quizEnd();
  const q = u.quiz[order[i]];
  const opts = q.o.map((t, j) => ({ t, j })).sort(() => Math.random() - .5);
  Q.answered = false;
  v.innerHTML = `
    <div class="q-head"><span>السؤال ${i + 1} / ${order.length}</span><span>النتيجة: ${Q.score}</span></div>
    <div class="bar" style="margin:0 0 16px"><i style="width:${i / order.length * 100}%"></i></div>
    <div class="q-text">${esc(q.q)}</div>
    ${opts.map(o => `<button class="opt" data-j="${o.j}" onclick="quizAnswer(this,${o.j})">${esc(o.t)}</button>`).join('')}
    <div id="qx"></div>`;
}
function quizAnswer(btn, j) {
  if (Q.answered) return; Q.answered = true;
  const q = Q.u.quiz[Q.order[Q.i]], ok = j === q.a;
  if (ok) Q.score++;
  document.querySelectorAll('.opt').forEach(b => { if (+b.dataset.j === q.a) b.classList.add('right'); });
  if (!ok) btn.classList.add('wrong');
  $('qx').innerHTML = `<div class="explain">${ok ? '✅ إجابة صحيحة!' : '❌ إجابة خاطئة.'}<br>${esc(q.e)}</div>
    <button class="btn-pink w100" onclick="Q.i++;quizStep();window.scrollTo(0,0)">${Q.i + 1 < Q.order.length ? 'السؤال التالي ←' : 'النتيجة النهائية 🏁'}</button>`;
}
function quizEnd() {
  const { u, score, order } = Q, total = order.length;
  const best = Math.max(score, store.get('quiz_' + u.id, 0)); store.set('quiz_' + u.id, best);
  const r = score / total;
  const msg = r >= .9 ? 'ممتاز! أنت جاهز للبكالوريا 🏆' : r >= .7 ? 'جيد جداً! راجع الأخطاء وستصل للعلامة الكاملة 💪' : r >= .5 ? 'لا بأس، راجع الملخص ثم أعد المحاولة 📖' : 'راجع الملخص جيداً ثم أعد الاختبار، ستتحسن 💪';
  $('view').innerHTML = `<div class="count"><b>${score} / ${total}</b>${msg}</div>
    <p class="hint">أفضل نتيجة لك: ${best} / ${total}</p>
    <button class="btn-pink w100" onclick="renderQuiz($('view'), unit('${u.id}'))">🔄 أعد الاختبار</button>
    <button class="btn-line w100" style="margin-top:8px" onclick="go('#/${u.id}/res')">📖 راجع الملخص</button>`;
}

function yEnd(y) { return dmy(y, 12, 31); }
// Règle du mois : acquisition du 1 au 15 → mois compté ; du 16 à la fin → non compté
function firstMonths(dateStr) { const [y, m, d] = dateStr.split('-').map(Number); return { y, m, d, months: d <= 15 ? 13 - m : 12 - m }; }

function planTable(rows, extra) {
  const head = extra === 'deg'
    ? '<tr><th>السنة (N)</th><th>أساس الحساب</th><th>المعدل المطبق</th><th>قسط الاهتلاك (An)</th><th>الاهتلاك المتراكم</th><th>القيمة المحاسبية الصافية (VNC)</th><th>الطريقة</th></tr>'
    : '<tr><th>السنة (N)</th><th>المبلغ القابل للاهتلاك (MA)</th><th>قسط الاهتلاك (An)</th><th>الاهتلاك المتراكم</th><th>القيمة المحاسبية الصافية (VNC)</th></tr>';
  return `<div class="tbl-wrap"><table class="acc">${head}${rows.join('')}</table></div><p class="hint">اسحب الجدول يميناً ويساراً إذا لزم الأمر ↔</p>`;
}
function journal(date, debits, credits, note) {
  const dl = debits.map(([acc, name, amt], i) => `<tr><td>${acc}</td><td></td><td class="lbl">${i ? '' : 'من '}حـ/ ${name}</td><td>${fmt(amt)}</td><td></td></tr>`).join('');
  const cl = credits.map(([acc, name, amt], i) => `<tr><td></td><td>${acc}</td><td class="lbl" style="padding-right:${i ? 26 : 18}px">${i ? '' : 'إلى '}حـ/ ${name}</td><td></td><td>${fmt(amt)}</td></tr>`).join('');

    <tr><td colspan="5" style="color:#555">(${note})</td></tr></table></div>`;

function calc_lin() {
  const MA = num('c-ma'); let N = num('c-n'); const t0 = num('c-t');
  if (!isFinite(N) && isFinite(t0) && t0 > 0) N = 100 / t0;
  if (!need(MA, N) || !$('c-date').value || N <= 0) return need(NaN);
  const t = 1 / N, An = MA * t, f = firstMonths($('c-date').value), code = $('c-asset').value;
  const rows = []; let sa = 0, y = f.y, left = N * 12, firstAmt = 0;
  while (left > 0.0001 && rows.length < 60) {
    const m = rows.length === 0 ? Math.min(f.months, left) : Math.min(12, left);
    let a = An * m / 12; if (left - m <= 0.0001) a = MA - sa;
    sa += a; left -= m; if (!rows.length) firstAmt = a;
    rows.push(`<tr><td>${yEnd(y)}${m < 12 ? `<br><small>(${m} أشهر)</small>` : ''}</td><td>${fmt(MA)}</td><td>${fmt(a)}</td><td>${fmt(sa)}</td><td>${fmt(MA - sa)}</td></tr>`);
    y++;
  }
  $('out').innerHTML = `<div class="formula">
      المعدل: ${L(`t = 100% / N = 100 / ${fmt(N)} = ${pct(t)}`)}<br>
      القسط السنوي: ${L(`An = MA × t = ${fmt(MA)} × ${fmt(t)} = ${fmt(An)} DA`)}<br>
      ${f.months < 12 ? `السنة الأولى (${f.months} أشهر): ${L(`A(${f.y}) = ${fmt(MA)} × ${fmt(t)} × (${f.months}/12) = ${fmt(firstAmt)} DA`)}` : 'السنة الأولى كاملة (12 شهراً).'}
    </div>${planTable(rows)}
    <h2 class="sec">قيد قسط السنة الأولى</h2>
    ${journal(yEnd(f.y), [['681', 'مخصصات الاهتلاكات والمؤونات وخسائر القيمة – الأصول غير الجارية', firstAmt]], [[amortAcc(code), 'اهتلاك ' + assetName(code), firstAmt]], 'إثبات قسط اهتلاك دورة ' + f.y)}`;
}

function calc_deg() {
  const MA = num('c-ma'), N = num('c-n');
  if (!need(MA, N) || !$('c-date').value || N < 3) { $('out').innerHTML = '<div class="verdict bad">⚠️ تأكد من القيم. الاهتلاك المتناقص يخص التثبيتات التي مدتها 3 سنوات فأكثر.</div>'; return; }
  const coef = N <= 4 ? 1.5 : N <= 6 ? 2 : 2.5, t = 1 / N, td = t * coef;
  const f = firstMonths($('c-date').value), code = $('c-asset').value;
  const rows = []; let vnc = MA, sa = 0, y = f.y, left = N * 12, linear = false, linAnnual = 0, linRateFix = 0, firstAmt = 0, switchYear = null;
  while (left > 0.0001 && rows.length < 60) {
    const m = rows.length === 0 ? Math.min(f.months, left) : Math.min(12, left);
    const linRate = 12 / left;
    if (!linear && linRate >= td - 1e-9) { linear = true; linAnnual = vnc * 12 / left; linRateFix = linRate; switchYear = y; }
    const base = vnc;
    let a = linear ? linAnnual * m / 12 : vnc * td * m / 12;
    if (left - m <= 0.0001) a = vnc;
    sa += a; vnc -= a; left -= m; if (!rows.length) firstAmt = a;
    rows.push(`<tr class="${y === switchYear ? 'sw' : ''}"><td>${yEnd(y)}${m < 12 ? `<br><small>(${m} أشهر)</small>` : ''}</td><td>${fmt(base)}</td><td>${linear ? pct(linRateFix) : pct(td)}${m < 12 ? ` × ${m}/12` : ''}</td><td>${fmt(a)}</td><td>${fmt(sa)}</td><td>${fmt(Math.max(vnc, 0))}</td><td>${linear ? 'خطي' : 'متناقص'}</td></tr>`);
    y++;
  }
  $('out').innerHTML = `<div class="formula">
      المعدل الخطي: ${L(`t = 100 / ${fmt(N)} = ${pct(t)}`)}<br>
      المعامل الجبائي (${N <= 4 ? '3 أو 4 سنوات' : N <= 6 ? '5 أو 6 سنوات' : 'أكثر من 6 سنوات'}) = ${L(coef)}<br>
      المعدل المتناقص: ${L(`t′ = ${pct(t)} × ${coef} = ${pct(td)}`)}<br>
      ${switchYear ? `التحول للخطي ابتداءً من سنة ${switchYear} (المعدل الخطي للمدة المتبقية ≥ ${pct(td)}) — السطر الملوّن.` : ''}
    </div>${planTable(rows, 'deg')}
    <h2 class="sec">قيد قسط السنة الأولى</h2>
    ${journal(yEnd(f.y), [['681', 'مخصصات الاهتلاكات والمؤونات وخسائر القيمة – الأصول غير الجارية', firstAmt]], [[amortAcc(code), 'اهتلاك ' + assetName(code), firstAmt]], 'إثبات قسط اهتلاك دورة ' + f.y)}`;
}

function calc_pro() {
  const MA = num('c-ma'), N = Math.round(num('c-n')), y0 = Math.round(num('c-y'));
  if (!need(MA, N, y0) || N < 1) return;
  const S = N * (N + 1) / 2, code = $('c-asset').value, rows = []; let sa = 0;
  for (let k = 1; k <= N; k++) {
    const a = k === N ? MA - sa : MA * k / S; sa += a;
    rows.push(`<tr><td>${y0 + k - 1} ${L(`(${k}/${S})`)}</td><td>${fmt(MA)}</td><td>${fmt(a)}</td><td>${fmt(sa)}</td><td>${fmt(MA - sa)}</td></tr>`);
  }
  $('out').innerHTML = `<div class="formula">
      مجموع أرقام السنوات: ${L(`S = N × (N + 1) / 2 = ${N} × ${N + 1} / 2 = ${S}`)}<br>
      قسط السنة k: ${L(`Ak = MA × k / ${S}`)}<br>
      السنة الأولى: ${L(`A1 = ${fmt(MA)} × 1/${S} = ${fmt(MA / S)} DA`)}
    </div>${planTable(rows)}
    <h2 class="sec">قيد قسط السنة الأولى</h2>
    ${journal(yEnd(y0), [['681', 'مخصصات الاهتلاكات والمؤونات وخسائر القيمة – الأصول غير الجارية', MA / S]], [[amortAcc(code), 'اهتلاك ' + assetName(code), MA / S]], 'إثبات قسط اهتلاك دورة ' + y0)}`;
}

function calc_pv() {
  const MA = num('c-ma'), SA = num('c-sa'), PV0 = isFinite(num('c-pv0')) ? num('c-pv0') : 0, PVN = num('c-pvn'), Nr = num('c-nr'), y = isFinite(num('c-y')) ? num('c-y') : '';
  if (!need(MA, SA, PVN)) return;
  const code = $('c-asset').value, vnc = MA - SA - PV0;
  let html = `<div class="formula">${L(`VNC = MA − ΣA${PV0 ? ' − PV' : ''} = ${fmt(MA)} − ${fmt(SA)}${PV0 ? ' − ' + fmt(PV0) : ''} = ${fmt(vnc)} DA`)}<br>${L(`PVN = ${fmt(PVN)} DA`)}</div>`;
  if (PVN >= vnc) {
    html += `<div class="verdict ok">✔ ${L('PVN ≥ VNC')} ← لا توجد خسارة قيمة، ولا يُسجَّل أي قيد.</div>`;
  } else {
    const pv = vnc - PVN, newVnc = PVN;
    html += `<div class="verdict bad">${L('PVN < VNC')} ← توجد خسارة قيمة:<br>${L(`PV = VNC − PVN = ${fmt(vnc)} − ${fmt(PVN)} = ${fmt(pv)} DA`)}</div>`;
    html += '<h2 class="sec">قيد معاينة خسارة القيمة</h2>' + journal(y ? yEnd(y) : '31/12', [['681', 'مخصصات الاهتلاكات والمؤونات وخسائر القيمة – الأصول غير الجارية', pv]], [[lossAcc(code), 'خسائر القيمة عن ' + assetName(code), pv]], 'إثبات خسارة القيمة للدورة');
    html += `<div class="formula">القيمة المحاسبية الصافية الجديدة: ${L(`VNC = ${fmt(newVnc)} DA`)}`;
    if (isFinite(Nr) && Nr > 0) html += `<br>القسط المعدّل للسنوات المتبقية: ${L(`An = VNC / Nr = ${fmt(newVnc)} / ${fmt(Nr)} = ${fmt(newVnc / Nr)} DA`)}`;
    else html += '<br>أدخل Nr (السنوات المتبقية) لحساب القسط المعدّل.';
    html += '</div>';
  }
  $('out').innerHTML = html;
}

function calc_ces() {
  const MA = num('c-ma'), SA = num('c-sa'), PV0 = isFinite(num('c-pv0')) ? num('c-pv0') : 0, P = num('c-price');
  if (!need(MA, SA, P) || !$('c-date').value) return;
  const code = $('c-asset').value, pay = $('c-pay'), payName = pay.options[pay.selectedIndex].text.split('— ')[1];
  const [y, m, d] = $('c-date').value.split('-').map(Number);
  const vnc = MA - SA - PV0, R = P - vnc;
  const debits = [[pay.value, payName, P], [amortAcc(code), 'اهتلاك ' + assetName(code), SA]];
  if (PV0) debits.push([lossAcc(code), 'خسائر القيمة عن ' + assetName(code), PV0]);
  if (R < 0) debits.push(['652', 'نواقص القيمة عن خروج الأصول المثبتة غير المالية', -R]);
  const credits = [[code, assetName(code), MA]];
  if (R > 0) credits.push(['752', 'فوائض القيمة عن خروج الأصول المثبتة غير المالية', R]);
  $('out').innerHTML = `<div class="formula">
      ${L(`VNC = MA − ΣA${PV0 ? ' − PV' : ''} = ${fmt(MA)} − ${fmt(SA)}${PV0 ? ' − ' + fmt(PV0) : ''} = ${fmt(vnc)} DA`)}<br>
      ${L(`R = ${fmt(P)} − ${fmt(vnc)} = ${fmt(R)} DA`)}</div>
    <div class="verdict ${R > 0 ? 'ok' : R < 0 ? 'bad' : 'info'}">${R > 0 ? `فائض قيمة ${fmt(R)} دج ← دائن حـ/752` : R < 0 ? `ناقص قيمة ${fmt(-R)} دج ← مدين حـ/652` : 'نتيجة معدومة: لا فائض ولا ناقص قيمة.'}</div>
    <div class="verdict info">⚠️ تذكير: قبل قيد التنازل، سجّل قسط اهتلاك سنة التنازل إلى تاريخ التنازل، وأدخل ΣA متضمناً هذا القسط.</div>
    <h2 class="sec">قيد التنازل</h2>
    ${journal(dmy(y, m, d), debits, credits, 'تسجيل عملية التنازل عن التثبيت')}`;
}

/* ---------- Unité 03 : stocks ---------- */
const A685 = ['685', 'المخصصات للاهتلاكات والمؤونات وخسائر القيمة – الأصول الجارية'];
const A785 = ['785', 'الاسترجاعات عن المؤونات وخسائر القيمة – الأصول الجارية'];
function calc_ecart() {
  const k = $('c-stock').value, st = STOCKS[k], cpt = num('c-cpt'), phy = num('c-phy'), y = num('c-y'), just = $('c-nat').value === 'j';
  if (!need(cpt, phy, y)) return;
  const d = phy - cpt;
  let html = `<div class="formula">فارق الجرد = الجرد المادي − الجرد المحاسبي<br>${L(`${fmt(phy)} − ${fmt(cpt)} = ${d > 0 ? '+' : ''}${fmt(d)} DA`)}</div>`;
  if (!d) { $('out').innerHTML = html + '<div class="verdict ok">لا يوجد فارق جرد ← لا يُسجَّل أي قيد.</div>'; return; }
  const neg = d < 0, amt = Math.abs(d);
  const other = just ? (k === '355' ? ['724', 'تغيرات المخزونات من المنتجات'] : st.p60) : (neg ? ['657', 'الأعباء الاستثنائية للتسيير الجاري'] : ['757', 'المنتوجات الاستثنائية للتسيير الجاري']);
  html += `<div class="verdict ${neg ? 'bad' : 'ok'}">فارق ${neg ? 'سالب (نقص)' : 'موجب (زيادة)'} ${just ? 'مبرر' : 'غير مبرر'} = ${fmt(amt)} دج<br>
    <span style="font-weight:400">الإشارة ${neg ? 'سالبة ← ح/' + k + ' دائن' : 'موجبة ← ح/' + k + ' مدين'} · الطبيعة ${just ? 'مبرر ← ح/' + other[0] : (neg ? 'غير مبرر سالب ← ح/657' : 'غير مبرر موجب ← ح/757')}</span></div>`;
  const stock = [k, st.name, amt], cp = [other[0], other[1], amt];
  html += '<h2 class="sec">قيد التسوية</h2>' + journal(yEnd(y), [neg ? cp : stock], [neg ? stock : cp], `تسجيل فارق الجرد ${just ? 'المبرر' : 'غير المبرر'} ${neg ? 'السالب' : 'الموجب'} – ${st.name}`);
  $('out').innerHTML = html;
}
function calc_dep() {
  const k = $('c-stock').value, st = STOCKS[k], phy = num('c-phy'), mkt = num('c-mkt'), prev = isFinite(num('c-prev')) ? num('c-prev') : 0, y = num('c-y');
  if (!need(phy, mkt, prev, y)) return;
  const cur = mkt < phy ? phy - mkt : 0, adj = cur - prev;
  let html = `<div class="formula">خ ق ${y} = الجرد المادي − سعر السوق ${mkt < phy ? `= ${L(`${fmt(phy)} − ${fmt(mkt)} = ${fmt(cur)} DA`)}` : `← سعر السوق (${fmt(mkt)}) ≥ الجرد المادي ← ${L('خ ق = 0')}`}<br>
    التعديل = خ ق ${y} − خ ق ${y - 1} = ${L(`${fmt(cur)} − ${fmt(prev)} = ${adj > 0 ? '+' : ''}${fmt(adj)} DA`)}</div>`;
  let kind;
  if (!adj) kind = 'لا تغيير ← لا يُسجَّل أي قيد';
  else if (adj > 0) kind = prev ? `زيادة خسارة القيمة بـ ${fmt(adj)} دج` : `إثبات خسارة القيمة لأول مرة بـ ${fmt(adj)} دج`;
  else kind = cur ? `إنقاص خسارة القيمة بـ ${fmt(-adj)} دج` : `إلغاء خسارة القيمة بـ ${fmt(-adj)} دج`;
  html += `<div class="verdict ${adj > 0 ? 'bad' : adj < 0 ? 'ok' : 'info'}">${kind}</div>`;
  if (adj > 0) html += '<h2 class="sec">قيد التسوية</h2>' + journal(yEnd(y), [[...A685, adj]], [[...st.p39, adj]], (prev ? 'زيادة' : 'إثبات') + ' خسارة القيمة – ' + st.name);
  if (adj < 0) html += '<h2 class="sec">قيد التسوية</h2>' + journal(yEnd(y), [[...st.p39, -adj]], [[...A785, -adj]], (cur ? 'إنقاص' : 'إلغاء') + ' خسارة القيمة – ' + st.name);
  html += `<h2 class="sec">في الميزانية الختامية</h2><div class="tbl-wrap"><table class="acc"><tr><th>الأصول</th><th>إجمالي ${y}</th><th>اهتلاك و خ ق</th><th>صافي ${y}</th></tr>
    <tr><td class="lbl">${st.name}</td><td>${fmt(phy)}</td><td>${cur ? fmt(cur) : '-'}</td><td>${fmt(phy - cur)}</td></tr></table></div>`;
  $('out').innerHTML = html;
}
function calc_inter() {
  const k = $('c-stock').value, st = STOCKS[k], s1 = num('c-s1'), s2 = num('c-s2'), y = num('c-y'), prod = k === '355';
  const buy = prod ? 0 : num('c-buy');
  if (!need(s1, s2, y, buy)) return;
  const v = prod ? ['724', 'تغيرات المخزونات من المنتجات'] : ['603', 'تغيرات المخزونات'];
  let html = '<h2 class="sec">المرحلة 1: إلغاء مخزون أول المدة</h2>' + journal(yEnd(y), [[...v, s1]], [[k, st.name, s1]], 'إلغاء مخزون أول المدة – ' + st.name);
  html += '<h2 class="sec">المرحلة 2: إثبات مخزون آخر المدة</h2>' + journal(yEnd(y), [[k, st.name, s2]], [[...v, s2]], 'إثبات مخزون آخر المدة – ' + st.name);
  if (!prod && buy) html += '<h2 class="sec">المرحلة 3: ترصيد ح/38</h2>' + journal(yEnd(y), [[...st.p60, buy]], [[...st.p38, buy]], 'ترصيد ح/' + st.p38[0]);
  if (prod) html += '<p class="hint">المنتجات المصنعة: مرحلتان فقط (لا توجد مشتريات).</p>';
  const d = s1 - s2;
  html = `<div class="formula">رصيد ح/${v[0]} = مخ1 − مخ2 = ${L(`${fmt(s1)} − ${fmt(s2)} = ${fmt(Math.abs(d))} DA`)}</div>
    <div class="verdict ${d > 0 ? 'bad' : d < 0 ? 'ok' : 'info'}">${d > 0 ? `رصيد مدين ← نقص في المخزون` : d < 0 ? `رصيد دائن ← زيادة في المخزون` : 'رصيد معدوم ← لا تغير في المخزون'}</div>` + html;
  $('out').innerHTML = html;
}
function calc_achat() {
  const k = $('c-stock').value, st = STOCKS[k], bal = num('c-bal'), y = num('c-y'), credit = $('c-side').value === 'c';
  if (!need(bal, y) || !bal) return need(NaN);
  const html = credit
    ? `<div class="verdict info">رصيد ح/${st.p38[0]} دائن ← الفاتورة لم تصل ← نستعمل ح/408 (يظهر في الخصوم)</div>` + journal(yEnd(y), [[...st.p38, bal]], [['408', 'موردو الفواتير التي لم تصل إلى أصحابها', bal]], `تسوية ح/${st.p38[0]} – عدم استلام الفاتورة`)
    : `<div class="verdict info">رصيد ح/${st.p38[0]} مدين ← المخزون لم يُستلم ← نستعمل ح/${st.p37[0]} (يظهر في سطر «مخزونات في الخارج»)</div>` + journal(yEnd(y), [[...st.p37, bal]], [[...st.p38, bal]], `تسوية ح/${st.p38[0]} – عدم استلام المخزون`);
  $('out').innerHTML = html;
}
